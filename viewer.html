<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Viewer</title></head><body>
<input type="file" id="f">
<div id="meta"></div>
<pre id="p" style="white-space:pre-wrap;word-break:break-all"></pre>
<script>
document.getElementById('f').addEventListener('change',function(e){
var file=e.target.files[0];if(!file)return;
var r=new FileReader();
r.onload=function(){var t=r.result;
document.getElementById('meta').textContent='CHARS:'+t.length+' START:'+t.slice(0,120)+' END:'+t.slice(-120);
document.getElementById('p').textContent=t;};
r.readAsText(file);});
</script>
</body></html>
