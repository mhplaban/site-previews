<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><br><button id="p">Prev</button> <span id="i"></span> <button id="n">Next</button><div id="m"></div><pre id="o" style="white-space:pre-wrap;word-break:break-all;"></pre><script>var f=document.getElementById('f'),o=document.getElementById('o'),m=document.getElementById('m'),i=document.getElementById('i');var t='',c=0,SZ=6000;function show(){var n=Math.ceil(t.length/SZ);c=Math.max(0,Math.min(c,n-1));o.textContent='CHUNK '+(c+1)+'/'+n+'\n'+t.slice(c*SZ,(c+1)*SZ);i.textContent=(c+1)+'/'+n;}f.addEventListener('change',function(){var a=f.files[0];if(!a)return;var r=new FileReader();r.onload=function(){t=r.result;c=0;m.textContent='OK '+a.name+' chars='+t.length;show();};r.readAsText(a);});document.getElementById('p').onclick=function(){c--;show();};document.getElementById('n').onclick=function(){c++;show();};</script></body></html>
