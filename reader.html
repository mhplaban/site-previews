<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><button id="p">Prev</button><button id="n">Next</button><span id="c"></span><div id="o"></div><script>var f=document.getElementById('f'),o=document.getElementById('o'),c=document.getElementById('c'),t='',b=0;function sh(){var s=b*2500,e=Math.min(s+2500,t.length);var tag='[B'+(b+1)+']';o.textContent=tag+t.substring(s,e)+tag;c.textContent=' '+(b+1)+'/'+Math.ceil(t.length/2500)+' ';}f.onchange=function(){var r=new FileReader();r.onload=function(){t=r.result;b=0;sh();};r.readAsText(f.files[0]);};document.getElementById('p').onclick=function(){if(b>0){b--;sh();}};document.getElementById('n').onclick=function(){if((b+1)*2500<t.length){b++;sh();}};</script></body></html>
