<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><button id="c">Copy All</button><div id="m"></div><script>var t='';var f=document.getElementById('f'),m=document.getElementById('m');f.addEventListener('change',function(){var a=f.files[0];if(!a)return;var r=new FileReader();r.onload=function(){t=r.result;m.textContent='Loaded '+a.name+' chars='+t.length;};r.readAsText(a);});document.getElementById('c').addEventListener('click',function(){navigator.clipboard.writeText(t).then(function(){m.textContent='Copied '+t.length+' chars';},function(e){m.textContent='Copy failed: '+e;});});</script></body></html>
