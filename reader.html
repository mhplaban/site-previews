<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><div id="o"></div><script>var f=document.getElementById('f'),o=document.getElementById('o');f.onchange=function(){var r=new FileReader();r.onload=function(){var t=r.result;o.innerHTML='<p>chars='+t.length+'</p>';for(var b=0;b<20;b++){var s=b*2500;if(s>=t.length)break;var e=Math.min(s+2500,t.length);var tag='[BATCH'+('00'+(b+1)).slice(-3)+']';var d=document.createElement('div');d.textContent=tag+t.substring(s,e)+tag;o.appendChild(d);}};r.readAsText(f.files[0]);};</script></body></html>
