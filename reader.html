<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><br><textarea id="o" readonly rows="30" cols="100"></textarea><script>var f=document.getElementById('f'),o=document.getElementById('o');f.onchange=function(){var r=new FileReader();r.onload=function(){o.value=r.result;};r.readAsText(f.files[0]);};</script></body></html>
