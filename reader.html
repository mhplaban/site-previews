<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reader</title></head><body><input type="file" id="f"><div id="m"></div><pre id="o" style="white-space:pre-wrap;word-break:break-all;"></pre><script>var f=document.getElementById('f'),o=document.getElementById('o'),m=document.getElementById('m');var SZ=500;f.addEventListener('change',function(){var a=f.files[0];if(!a)return;var r=new FileReader();r.onload=function(){var t=r.result;var n=Math.ceil(t.length/SZ);var out='';for(var b=0;b<n;b++){var s=t.slice(b*SZ,(b+1)*SZ);var tag='[BLK'+String(b+1).padStart(2,'0')+']';var ls=s.split('\n');for(var j=0;j<ls.length;j++){out+=tag+ls[j]+'\n';}}o.textContent=out;m.textContent='OK '+a.name+' chars='+t.length+' blocks='+n;};r.readAsText(a);});</script></body></html>
